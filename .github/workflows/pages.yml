name: Website

# Publishes the offline build (OCR engine included) on GitHub Pages, so it
# can be opened on any phone and added to the Home Screen — the way to get
# FraudSentry on an iPhone. One-time setup: Settings → Pages → Source:
# "GitHub Actions". Runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:offline
      - run: rm -f dist-offline/_headers   # Netlify-only file; GitHub Pages ignores it
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-offline }
      - id: deployment
        uses: actions/deploy-pages@v4
