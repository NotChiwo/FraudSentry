name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fraudsentry-single-file
          path: dist/index.html
          retention-days: 14
      # offline build: OCR engine + language data embedded (also checks the
      # embedded engine's hash against TESSERACT_SRI)
      - run: npm run build:offline
      - uses: actions/upload-artifact@v4
        with:
          name: fraudsentry-offline
          path: dist-offline/index.html
          retention-days: 14
